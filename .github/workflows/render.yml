name: Render Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      
uses: actions/checkout@v3

      
name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

      
name: Install dependencies
      run: npm install

      
name: Render video
      run: npm run build

      
name: Upload video
      uses: actions/upload-artifact@v3
      with:
        name: rendered-video
        path: out/
